name: build-exe
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/Scripts/pip install -e . pyinstaller
      - name: Inno Setup
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup --no-progress -y; fi
      - name: Build installer
        run: bash packaging/build_exe.sh
      - name: Install silently
        shell: pwsh
        working-directory: app
        run: |
          $setup = Get-ChildItem ..\dist\PSERiemann-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:RUNNER_TEMP\rie" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\rie\pse-riemann.exe")) { throw "not installed" }
      - name: Selftest
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\rie\pse-riemann.exe" -ArgumentList '--selftest' -PassThru -Wait -RedirectStandardOutput "$env:RUNNER_TEMP\st.log" -RedirectStandardError "$env:RUNNER_TEMP\ste.log"
          Write-Host "--- stdout:"; Get-Content "$env:RUNNER_TEMP\st.log" -ErrorAction SilentlyContinue
          Write-Host "--- stderr:"; Get-Content "$env:RUNNER_TEMP\ste.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: pse-riemann-exe
          path: dist/*.exe
